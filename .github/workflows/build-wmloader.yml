name: Build wmloader (NTS/ZTS × glibc/musl × x86_64/arm64)

# يبني wmloader.so لعدة بيئات عملاء مختلفة:
#   - إصدار PHP: من حقل php_versions عند التشغيل اليدوي، أو القائمة الافتراضية أدناه
#   - Thread Safety: NTS (php-fpm/LiteSpeed، الأشيع) و ZTS (Apache mod_php)
#   - مكتبة C: glibc (Ubuntu/Debian/AlmaLinux/CloudLinux/cPanel) و musl (Alpine)
#   - المعمارية: x86_64 و arm64 (VPS/سيرفرات ARM الحديثة مثل Ampere/Graviton)
#
# الفكرة: بدل الاعتماد على حزم جاهزة من توزيعة معيّنة (تسمية حزم ZTS تختلف بين
# Remi/Ubuntu PPA/Alpine وتعقّد المطابقة)، كل job يبني PHP نفسه من الكود المصدري
# (php-src) بالإصدار ووضع TS المطلوبين، فيحصل على phpize/php-config مطابقين تمامًا
# لما سيعمل عليه wmloader.so عند العميل، بغض النظر عن توزيعته.
#
# ملاحظات مهمة:
#  1) البناء لـ glibc يتم داخل almalinux:8 (glibc 2.28) عمدًا: التوافق في glibc
#     اتجاه واحد فقط (أحدث يشغّل الأقدم وليس العكس)، فهذا يضمن عمل الملف على خوادم
#     حديثة وقديمة معًا. استبدلها بـ almalinux:9 فقط لو عملاؤك على توزيعات حديثة جدًا.
#  2) رانر arm64 المجاني (ubuntu-22.04-arm) متاح فقط لريبو عام (public). لو الريبو
#     خاص (private) — وهذا هو الغالب لأداة تشفير خاصة بك — ستحتاج GitHub Larger
#     Runners المدفوعة لـ arm64، أو self-hosted runner على جهاز/VPS ARM فعلي.
#     توليفة musl+arm64 مستبعدة أدناه لسببين متراكبين: قيد Node.js التقني من GitHub
#     (انظر ملاحظة exclude)، وقرار تجاري مؤقت بتأجيل خدمة هذه الشريحة إلى ما بعد
#     تحقيق المشروع أول إيرادات - لا عملاء فعليين عليها حاليًا يبرّرون الاستثمار في
#     رانر ذاتي أو خادم ARM مخصَّص. عند إعادة النظر لاحقًا: إن ظهر عميل عاجل عليها
#     قبل ذلك، بديل مجاني فوري دون خادم أو بطاقة دفع هو محاكاة QEMU
#     (tonistiigi/binfmt) داخل ubuntu-latest نفسه - أبطأ كثيرًا لكنه كافٍ لبناء
#     لمرة واحدة.
#  3) المصفوفة الكاملة = عدد إصدارات PHP × 2(libc) × 2(ts) × 2(arch)، فهي كثيرة
#     Jobs دفعة واحدة؛ استخدم حقل php_versions عند التشغيل اليدوي لتضييقها وقت الحاجة.
#
# المصدر (config.m4, php_wmloader.h, wmcrypto.h, wmloader.c) يجب أن يكون موجودًا في هذا
# الريبو تحت المسار المحدد في SOURCE_DIR أدناه.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      php_versions:
        description: "إصدارات PHP (مفصولة بفواصل)"
        default: "8.1,8.2,8.3,8.4"
        required: false

env:
  SOURCE_DIR: source-dir   # عدّل هذا إن كانت ملفات wmloader في مسار آخر من الريبو
  # نسخة OpenSSL LTS المضمَّنة ساكنًا في كل نسخ wmloader.so — لتحديثها أمنيًا مستقبلًا
  # (CVE جديد مثلًا) غيّر هذا السطر فقط، ثم راجع الرقم الأحدث من:
  # https://openssl-library.org/source/  (التزم بسلسلة 3.5.x LTS، مدعومة حتى أبريل 2030)
  OPENSSL_VERSION: "3.5.7"

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      php_json: ${{ steps.set.outputs.php_json }}
    steps:
      - id: set
        run: |
          IN="${{ github.event.inputs.php_versions || '8.1,8.2,8.3,8.4' }}"
          JSON=$(echo "$IN" | tr ',' '\n' | awk 'NF {$1=$1; print}' | jq -R . | jq -sc .)
          echo "php_json=$JSON" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-latest' }}
    container:
      image: ${{ matrix.libc == 'glibc' && 'almalinux:8' || 'alpine:3.19' }}
    strategy:
      fail-fast: false
      matrix:
        libc: [glibc, musl]
        php: ${{ fromJson(needs.matrix.outputs.php_json) }}
        ts: [nts, zts]
        arch: [x86_64, arm64]
        exclude:
          # دمج Alpine (musl) + arm64 غير مدعوم حاليًا على GitHub-hosted runners: الأكشنز
          # المبنية بـ JavaScript (checkout, upload-artifact...) تحتاج Node.js من رانر
          # الاستضافة نفسه، ولا يوجد بناء Node رسمي لـ musl+arm64 بعد (قيد GitHub نفسها،
          # وليس خطأ في هذا الملف). لو احتجته فعليًا لاحقًا سيلزم self-hosted runner ARM
          # عليه Node مثبّت مسبقًا داخل الحاوية.
          - libc: musl
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: تثبيت أدوات البناء (AlmaLinux/glibc)
        if: matrix.libc == 'glibc'
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled powertools
          dnf install -y gcc gcc-c++ make autoconf automake libtool bison \
            git pkgconfig libxml2-devel sqlite-devel zlib-devel \
            file diffutils curl xz python39 binutils gnupg2 perl

      - name: تثبيت re2c حديث (AlmaLinux 8 — PowerTools تحتوي 0.14.3 فقط، وPHP 8.3+ يتطلب 1.0.3+)
        if: matrix.libc == 'glibc'
        run: |
          curl -fsSL -o /tmp/re2c.tar.xz https://github.com/skvadrik/re2c/releases/download/3.1/re2c-3.1.tar.xz
          tar -xf /tmp/re2c.tar.xz -C /tmp
          cd /tmp/re2c-3.1
          ./configure
          make -j"$(nproc)"
          make install
          re2c --version

      - name: تثبيت أدوات البناء (Alpine/musl)
        if: matrix.libc == 'musl'
        run: |
          apk add --no-cache bash build-base linux-headers autoconf automake \
            libtool bison re2c git pkgconfig libxml2-dev sqlite-dev \
            zlib-dev file diffutils binutils gnupg perl

      - name: تنزيل كود PHP-${{ matrix.php }} المصدري
        run: git clone --depth 1 --branch "PHP-${{ matrix.php }}" https://github.com/php/php-src.git /tmp/php-src

      - name: بناء وتثبيت PHP ${{ matrix.php }} (${{ matrix.ts }}) محليًا — فقط للحصول على phpize/php-config المطابقين
        working-directory: /tmp/php-src
        run: |
          ./buildconf --force
          EXTRA_TS=""
          if [ "${{ matrix.ts }}" = "zts" ]; then EXTRA_TS="--enable-zts"; fi
          ./configure --prefix=/opt/php --disable-all --disable-cgi --without-pear $EXTRA_TS
          make -j"$(nproc)"
          make install
          /opt/php/bin/php-config --version
          ACTUAL_ZTS=$(/opt/php/bin/php -r 'echo (int) PHP_ZTS;')
          EXPECTED_ZTS=0; [ "${{ matrix.ts }}" = "zts" ] && EXPECTED_ZTS=1
          if [ "$ACTUAL_ZTS" != "$EXPECTED_ZTS" ]; then
            echo "::error::توقعنا matrix.ts=${{ matrix.ts }} (ZTS=$EXPECTED_ZTS) لكن PHP المبني فعليًا ZTS=$ACTUAL_ZTS — غالبًا خيار configure غير مدعوم/تم تجاهله بصمت"
            exit 1
          fi

      - name: بناء OpenSSL ${{ env.OPENSSL_VERSION }} من المصدر (نسخة موحّدة ومُتحقَّقة لكل البيئات)
        # لا نعتمد على openssl-devel/openssl-dev الخاصة بصورة البناء (AlmaLinux 8 = 1.1.1
        # منتهية الدعم أمنيًا، Alpine 3.19 = نسخة مختلفة) — بل نبني نسخة LTS واحدة محددة
        # ومُتحقَّق من بصمتها وتوقيعها الرقمي، فتكون مطابقة 100% عبر كل توليفات المصفوفة،
        # ويصبح تحديثها أمنيًا لاحقًا مجرد تغيير OPENSSL_VERSION بالأعلى (بند env).
        run: |
          mkdir -p /tmp/openssl-src && cd /tmp/openssl-src
          BASE="https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}"
          curl -fLO "${BASE}/openssl-${OPENSSL_VERSION}.tar.gz"
          curl -fLO "${BASE}/openssl-${OPENSSL_VERSION}.tar.gz.sha256"
          curl -fLO "${BASE}/openssl-${OPENSSL_VERSION}.tar.gz.asc"
          sha256sum -c "openssl-${OPENSSL_VERSION}.tar.gz.sha256"

          curl -fsSL https://openssl-library.org/source/pubkeys.asc -o openssl-pubkeys.asc
          (command -v gpg >/dev/null || (command -v apk >/dev/null && apk add --no-cache gnupg) || (command -v dnf >/dev/null && dnf install -y gnupg2))
          gpg --import openssl-pubkeys.asc
          # بصمة مفتاح التوقيع الرسمي لـ OpenSSL — راجعها دوريًا مقابل
          # https://openssl-library.org/policies/general/artifact-signing-policy/
          echo "B146647E45A7B33947AB226B2A2C87D161692D40:6:" | gpg --import-ownertrust
          gpg --verify "openssl-${OPENSSL_VERSION}.tar.gz.asc" "openssl-${OPENSSL_VERSION}.tar.gz"

          tar -xf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure no-shared no-tests no-docs --prefix=/opt/openssl-static --libdir=lib
          make -j"$(nproc)"
          make install_sw
          test -f /opt/openssl-static/lib/libcrypto.a || { echo "::error::فشل بناء libcrypto.a الساكنة"; exit 1; }

      - name: بناء wmloader.so مقابل PHP ${{ matrix.php }} (${{ matrix.ts }}, ${{ matrix.libc }}, ${{ matrix.arch }})
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          CPPFLAGS: -I/opt/openssl-static/include
          LDFLAGS: -L/opt/openssl-static/lib
        run: |
          /opt/php/bin/phpize
          ./configure --enable-wmloader --with-php-config=/opt/php/bin/php-config
          make -j"$(nproc)"
          file modules/wmloader.so

      - name: ضمان الربط الساكن فعليًا (شبكة أمان)
        # لو تجاهل configure السابق مسارات CPPFLAGS/LDFLAGS ورجع للديناميكي النظامي
        # (يعتمد على كيفية كتابة config.m4)، هذه الخطوة تجبر الربط بنسختنا الساكنة
        # المبنية للتو بدل أي libcrypto/libssl أخرى موجودة على صورة البناء.
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          if grep -qE '(^|[^-])-lcrypto' Makefile; then
            sed -i "s|-lcrypto|/opt/openssl-static/lib/libcrypto.a|g" Makefile
            sed -i "s|-lssl|/opt/openssl-static/lib/libssl.a|g" Makefile
            make clean && make -j"$(nproc)"
          fi
          file modules/wmloader.so

      - name: التحقق من صفر اعتماد ديناميكي على OpenSSL
        # شبكة أمان: لو فشل الربط الساكن أعلاه أو تغيّر config.m4 مستقبلًا بما يعيد
        # إدخال -lcrypto ديناميكيًا، هذه الخطوة توقف الـ job فورًا بدل شحن .so معطوب بصمت
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          DEPS=$(readelf -d modules/wmloader.so | grep NEEDED || true)
          echo "$DEPS"
          if echo "$DEPS" | grep -qiE 'libssl|libcrypto'; then
            echo "::error::wmloader.so لا يزال مرتبطًا ديناميكيًا بـ OpenSSL رغم خطوة الربط الساكن"
            exit 1
          fi

      - name: توليد بيان التوافق (manifest.env) من نفس PHP المبنيّ للتو
        # يُقرأ من /opt/php/bin/php مباشرة (الثنائي الفعلي الذي بُني له wmloader.so)
        # لا من صورة خارجية - صفر تخمين. uname -m هو الحقيقي من النظام، وليس
        # ${{ matrix.arch }} (الذي يكتب arm64 بينما uname -m الفعلي يُرجع aarch64 -
        # استعمال تسمية المصفوفة هنا كان سيُسقط مطابقة كل توليفات ARM بصمت لاحقًا).
        run: |
          VARIANT="php${{ matrix.php }}-${{ matrix.ts }}-${{ matrix.libc }}-${{ matrix.arch }}"
          mkdir -p "dist/$VARIANT"
          cp "${{ env.SOURCE_DIR }}/modules/wmloader.so" "dist/$VARIANT/wmloader.so"
          {
            echo "WMLOADER_PHP_VERSION=$(/opt/php/bin/php -r 'echo PHP_VERSION;')"
            echo "WMLOADER_ZEND_MODULE_API=$(/opt/php/bin/php -i | awk -F'=> ' '/^PHP Extension =>/{print $2; exit}')"
            echo "WMLOADER_ZEND_EXTENSION_API=$(/opt/php/bin/php -i | awk -F'=> ' '/^Zend Extension =>/{print $2; exit}')"
            echo "WMLOADER_ARCH=$(uname -m)"
            echo "WMLOADER_LIBC=${{ matrix.libc }}"
            echo "WMLOADER_ZTS=$(/opt/php/bin/php -r 'echo (int)(defined("PHP_ZTS") ? PHP_ZTS : 0);')"
            echo "WMLOADER_BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "WMLOADER_SOURCE_COMMIT=${{ github.sha }}"
          } > "dist/$VARIANT/manifest.env"
          cat "dist/$VARIANT/manifest.env"

      - name: رفع الناتج كـ artifact (so + manifest.env معًا)
        uses: actions/upload-artifact@v4
        with:
          name: wmloader-php${{ matrix.php }}-${{ matrix.ts }}-${{ matrix.libc }}-${{ matrix.arch }}
          path: dist/*/
          if-no-files-found: error

  release:
    # يجمع كل نسخ .so في GitHub Release واحد عند دفع تاغ (مثل v2.0.1)
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # مطلوبة لإنشاء Release — بدونها softprops/action-gh-release يفشل بخطأ 403
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: ضغط كل توليفة (so + manifest.env) في أرشيف واحد
        # لا أفترض عمق تداخل مجلدات artifacts بعد التنزيل (يختلف حسب سلوك
        # upload/download-artifact)؛ أبحث عن wmloader.so أينما كان تحت dist/،
        # واسم الأرشيف مُشتقّ من حقول manifest.env نفسها (حقيقة، لا تخمين مسار).
        run: |
          mkdir -p release
          find dist -type f -name wmloader.so -print0 | while IFS= read -r -d '' so; do
            d="$(dirname "$so")"
            [ -f "$d/manifest.env" ] || { echo "manifest.env ناقص في $d" >&2; exit 1; }
            ( set -a; . "$d/manifest.env"; set +a
              ts="nts"; [ "$WMLOADER_ZTS" = 1 ] && ts="zts"
              variant="php${WMLOADER_PHP_VERSION%.*}-${ts}-${WMLOADER_LIBC}-${WMLOADER_ARCH}"
              (cd "$d" && zip -q -j "$OLDPWD/release/wmloader-${variant}.zip" wmloader.so manifest.env)
            )
          done
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
